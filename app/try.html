<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThriftLLM — try it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="/static/app.css">
<style>
  body { min-height: 100vh; }
  .page { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 22px; width: 100%; }

  .top { border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
  .top .wrap { display: flex; align-items: center; gap: 14px; height: 56px; }
  .logo { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; text-decoration: none; color: var(--text-primary); }
  .logo .dot { color: var(--accent); }
  .quota { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); font-family: "IBM Plex Mono", monospace; }
  .pips { display: flex; gap: 4px; }
  .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); transition: background 0.3s ease; }
  .pip.spent { background: var(--surface-3); }
  .top .signin { font-size: 13px; color: var(--text-secondary); text-decoration: none; }
  .top .signin:hover { color: var(--text-primary); }

  main { flex: 1; padding: 34px 0 20px; }
  .intro { text-align: center; margin-bottom: 30px; }
  .intro h1 { font-size: clamp(22px, 4vw, 30px); margin: 0 0 8px; font-weight: 700; letter-spacing: -0.025em; }
  .intro p { color: var(--text-muted); font-size: 13.5px; margin: 0; line-height: 1.6; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 20px; }
  .chip {
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary);
    padding: 8px 13px; border-radius: 9px; font-size: 12.5px; cursor: pointer; font-family: inherit;
    transition: transform 0.14s ease, border-color 0.14s ease;
  }
  .chip:hover { transform: translateY(-1px); border-color: var(--border-strong); color: var(--text-primary); }

  .turn { margin-bottom: 24px; }
  .q { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .q span { background: var(--accent); color: #001018; padding: 9px 14px; border-radius: 13px; font-size: 14px; max-width: 78%; white-space: pre-wrap; }
  .a { font-size: 14.5px; line-height: 1.68; }
  .a p { margin: 0 0 10px; } .a p:last-child { margin-bottom: 0; }
  .a ul, .a ol { margin: 0 0 10px; padding-left: 22px; }
  .a h1, .a h2, .a h3 { font-size: 1.05em; margin: 13px 0 7px; }
  .a code { font-size: 0.88em; background: var(--surface-2); padding: 2px 5px; border-radius: 4px; }
  .a pre { margin: 0 0 10px; border-radius: 8px; overflow-x: auto; }
  .a pre code { display: block; padding: 12px 14px; background: #0a0a0a !important; border-radius: 8px; font-size: 0.85em; }
  .a table { border-collapse: collapse; margin: 0 0 10px; font-size: 0.9em; display: block; overflow-x: auto; }
  .a th, .a td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }

  .caret { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: text-bottom; animation: pulse-dot 1s steps(2) infinite; margin-left: 2px; }

  .routeline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); margin-top: 10px; }
  .routeline .mono { font-family: "IBM Plex Mono", monospace; }
  .escalated-note {
    border-left: 2px solid var(--warning); background: rgba(250,178,25,0.07); padding: 8px 11px;
    border-radius: 0 7px 7px 0; font-size: 12px; color: var(--warning); margin: 10px 0;
  }

  .composer-bar { border-top: 1px solid var(--border); padding: 14px 0 22px; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(12px); position: sticky; bottom: 0; }
  .cbox { display: flex; flex-direction: column; gap: 8px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 12px 12px 10px; }
  .cbox:focus-within { border-color: var(--border-strong); }
  .cbox textarea { width: 100%; resize: none; border: none; background: none; color: var(--text-primary); font-family: inherit; font-size: 14px; line-height: 1.55; outline: none; max-height: 160px; }
  .cbox textarea::placeholder { color: var(--text-muted); }
  .cbox .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cbox .hint { font-size: 11px; color: var(--text-muted); }
  .cbox button { width: 30px; height: 30px; padding: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

  .gate { text-align: center; padding: 26px 20px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface-1); }
  .gate h3 { margin: 0 0 6px; font-size: 16px; font-weight: 650; }
  .gate p { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; line-height: 1.6; }
  .gate .cta { display: inline-block; background: var(--accent); color: #001018; text-decoration: none; font-weight: 650; font-size: 13.5px; padding: 10px 20px; border-radius: 9px; }
  .gate .cta:hover { background: #4d95ea; }
  .gate .alt { display: block; margin-top: 12px; font-size: 12.5px; color: var(--text-secondary); text-decoration: none; }
</style>
<script>document.documentElement.classList.add("js-motion");</script>
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="grid"></div><div class="orb a"></div><div class="orb b"></div>
</div>

<div class="page">
  <div class="top">
    <div class="wrap">
      <a href="/" class="logo">Thrift<span class="dot">LLM</span></a>
      <div class="quota">
        <span class="pips" id="pips"></span>
        <span id="quota-text">3 prompts left</span>
      </div>
      <a href="/app" class="signin">Sign in &rarr;</a>
    </div>
  </div>

  <main>
    <div class="wrap">
      <div class="intro animate-in" id="intro">
        <h1>Watch it pick a model</h1>
        <p>Three prompts, no account. Each answer shows which tier handled it, what it cost,<br>
           and whether the router had to escalate.</p>
        <div class="chips" id="chips"></div>
      </div>
      <div id="thread"></div>
    </div>
  </main>

  <div class="composer-bar" id="composer-bar">
    <div class="wrap">
      <div class="cbox">
        <textarea id="input" rows="1" placeholder="Ask anything..."></textarea>
        <div class="row">
          <span class="hint" id="predict-hint">Tier picked automatically</span>
          <button id="send" title="Send">&uarr;</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="/static/reveal.js"></script>
<script>
  marked.setOptions({ breaks: true });
  const LIMIT = 3;
  let remaining = LIMIT;
  let busy = false;

  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const thread = document.getElementById("thread");

  const EXAMPLES = [
    "What are data structures?",
    "What is 5 + 3?",
    "Design a distributed rate limiter and explain the tradeoffs step by step",
  ];

  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function md(s) { return DOMPurify.sanitize(marked.parse(s)); }

  function renderQuota() {
    document.getElementById("pips").innerHTML = Array.from({ length: LIMIT }, (_, i) =>
      `<span class="pip${i < LIMIT - remaining ? " spent" : ""}"></span>`).join("");
    document.getElementById("quota-text").textContent =
      remaining === 0 ? "no prompts left" : `${remaining} prompt${remaining === 1 ? "" : "s"} left`;
  }

  function renderChips() {
    document.getElementById("chips").innerHTML = "";
    EXAMPLES.forEach(p => {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = p;
      b.onclick = () => { input.value = p; send(); };
      document.getElementById("chips").appendChild(b);
    });
  }

  function showGate() {
    document.getElementById("composer-bar").innerHTML = `
      <div class="wrap">
        <div class="gate animate-in">
          <h3>That's the demo</h3>
          <p>You've used all ${LIMIT} prompts. A free account gives you unlimited chats, saved
             sessions with running cost totals, and the option to route through your own models.</p>
          <a class="cta" href="/app">Create a free account</a>
          <a class="alt" href="/">&larr; Back to the overview</a>
        </div>
      </div>`;
  }

  async function send() {
    const content = input.value.trim();
    if (!content || busy || remaining <= 0) return;
    busy = true;
    input.value = "";
    autosize();
    document.getElementById("intro")?.remove();
    sendBtn.disabled = true;

    const turn = document.createElement("div");
    turn.className = "turn animate-in";
    turn.innerHTML = `<div class="q"><span>${esc(content)}</span></div>
                      <div class="a"><span class="caret"></span></div>
                      <div class="routeline"></div>`;
    thread.appendChild(turn);
    const answerEl = turn.querySelector(".a");
    const routeEl = turn.querySelector(".routeline");
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

    let buffer = "";
    try {
      const resp = await fetch("/api/try", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content }), credentials: "same-origin",
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || `request failed (${resp.status})`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let carry = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        carry += decoder.decode(value, { stream: true });
        const frames = carry.split("\n\n");
        carry = frames.pop();
        for (const frame of frames) {
          const line = frame.split("\n").find(l => l.startsWith("data: "));
          if (!line) continue;
          handleEvent(JSON.parse(line.slice(6)), answerEl, routeEl, () => buffer, v => { buffer = v; });
        }
      }
    } catch (err) {
      answerEl.innerHTML = `<span style="color:var(--critical)">${esc(err.message)}</span>`;
      routeEl.innerHTML = "";
    } finally {
      busy = false;
      sendBtn.disabled = false;
      renderQuota();
      if (remaining <= 0) showGate(); else input.focus();
    }
  }

  function handleEvent(ev, answerEl, routeEl, getBuf, setBuf) {
    if (ev.type === "routing") {
      routeEl.innerHTML = `<span class="badge ${ev.initial_tier}">${ev.initial_tier}</span>
        <span>classified <b>${esc(ev.difficulty)}</b> &middot; starting here</span>`;
    } else if (ev.type === "token") {
      setBuf(getBuf() + ev.text);
      answerEl.innerHTML = md(getBuf()) + '<span class="caret"></span>';
      window.scrollTo({ top: document.body.scrollHeight });
    } else if (ev.type === "escalated") {
      // The answer so far failed its check -- drop it and let the next tier
      // replace it, with a visible note so the swap isn't mysterious.
      setBuf("");
      answerEl.innerHTML = `<div class="escalated-note">${esc(ev.from)} didn't pass the check${ev.to ? ` &mdash; escalating to ${esc(ev.to)}` : ""}. ${esc(ev.reason || "")}</div><span class="caret"></span>`;
    } else if (ev.type === "done") {
      answerEl.innerHTML = md(ev.text);
      answerEl.querySelectorAll("pre code").forEach(b => { try { hljs.highlightElement(b); } catch {} });
      remaining = ev.remaining;
      const saved = ev.saved > 0 ? ` &middot; <span style="color:var(--good)">saved $${ev.saved.toFixed(5)}</span>` : "";
      routeEl.innerHTML = `<span class="badge ${ev.final_tier}">${ev.final_tier}</span>
        <span class="mono">$${ev.total_cost.toFixed(5)} &middot; ${Math.round(ev.total_latency_ms)}ms</span>
        ${ev.escalated ? '<span class="badge escalated">escalated</span>' : ""}
        <span>classified ${esc(ev.difficulty)}</span>${saved}`;
    } else if (ev.type === "error") {
      answerEl.innerHTML = `<span style="color:var(--critical)">${esc(ev.detail)}</span>`;
    }
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.onclick = send;

  (async function init() {
    renderChips();
    try {
      const q = await (await fetch("/api/try/quota", { credentials: "same-origin" })).json();
      remaining = q.remaining;
    } catch { /* fall back to the optimistic default */ }
    renderQuota();
    if (remaining <= 0) showGate();
  })();
</script>
</body>
</html>
