<text x="0.0" y="38.0" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#767676" text-anchor="start" font-weight="400">116 routed queries, measured - same tokens priced three ways</text>
<rect x="150" y="56" width="428.6" height="30" rx="3" fill="#199e70"/>
<text x="138.0" y="75.0" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#9b9b9b" text-anchor="end" font-weight="600">frontier-only</text>
<text x="588.6" y="75.0" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#9b9b9b" text-anchor="start" font-weight="400">$0.60659</text>
<rect x="150" y="102" width="14.4" height="30" rx="3" fill="#d95926"/>
<text x="138.0" y="121.0" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#9b9b9b" text-anchor="end" font-weight="600">mid-only</text>
<text x="174.4" y="121.0" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#9b9b9b" text-anchor="start" font-weight="400">$0.02045</text>
<rect x="150" y="148" width="14.4" height="30" rx="3" fill="#3987e5"/>
<text x="138.0" y="167.0" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#9b9b9b" text-anchor="end" font-weight="600">cascade</text>
<text x="174.4" y="167.0" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#9b9b9b" text-anchor="start" font-weight="400">$0.02035</text>
<text x="150.0" y="208.0" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#3987e5" text-anchor="start" font-weight="700">97% under frontier-only</text>
