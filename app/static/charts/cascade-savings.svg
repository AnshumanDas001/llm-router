<text x="150.0" y="228.0" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#767676" text-anchor="start" font-weight="400">routed - cheap: 43  mid: 73  frontier: 0   |   escalated: 17</text>
