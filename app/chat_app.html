<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LLM Router Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;650&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="/static/app.css">
<style>
  /* --- auth screen --- */
  #auth-screen { height: 100vh; display: flex; align-items: center; justify-content: center; }
  .auth-box { width: 320px; }
  .auth-box h1 { font-size: 16px; margin: 0 0 4px; }
  .auth-box .sub { color: var(--text-muted); font-size: 12.5px; margin: 0 0 20px; }
  .auth-box input { width: 100%; margin-bottom: 10px; }
  .auth-box button { width: 100%; margin-top: 4px; }
  .auth-toggle { text-align: center; margin-top: 14px; font-size: 12.5px; color: var(--text-muted); }
  .auth-toggle a { cursor: pointer; text-decoration: none; }
  .auth-error { color: var(--critical); font-size: 12px; margin-bottom: 8px; min-height: 14px; }

  /* --- chat-list, nested inside the shared nav sidebar --- */
  #new-chat-btn { margin: 12px 14px 8px; width: calc(100% - 28px); }
  #chat-list { flex: 1; overflow-y: auto; padding: 0 8px; min-height: 0; }
  .chat-item { padding: 9px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; font-size: 12.5px; }
  .chat-item:hover { background: var(--surface-2); }
  .chat-item.active { background: var(--surface-2); border: 1px solid var(--border); }
  .chat-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .saved { color: var(--good); font-size: 11px; margin-top: 2px; }

  /* --- chat main pane --- */
  #chat-main { display: flex; flex-direction: column; height: 100vh; min-width: 0; }
  #chat-header {
    padding: 14px 22px; border-bottom: 1px solid var(--border); display: flex;
    justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  #chat-header h2 { font-size: 14px; margin: 0; font-weight: 650; }
  #cost-saved-stat { font-size: 12.5px; color: var(--good); font-weight: 600; }
  #cost-saved-stat .label { color: var(--text-muted); font-weight: 400; }

  #messages { flex: 1; overflow-y: auto; padding: 22px; }
  .msg { max-width: 640px; margin-bottom: 18px; }
  .msg.user { margin-left: auto; }
  .msg .bubble { padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
  .msg.user .bubble { background: var(--accent); color: #001018; white-space: pre-wrap; }
  .msg.assistant .bubble { background: var(--surface-1); border: 1px solid var(--border); }

  /* rendered markdown inside assistant bubbles */
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble li { margin-bottom: 3px; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 1.05em; margin: 14px 0 8px; }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble strong { font-weight: 700; }
  .bubble a { text-decoration: underline; }
  .bubble blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 2px solid var(--border); color: var(--text-muted); }
  .bubble code { font-size: 0.88em; background: var(--surface-2); padding: 2px 5px; border-radius: 4px; }
  .bubble pre { margin: 0 0 10px; border-radius: 8px; overflow-x: auto; max-width: 100%; }
  .bubble pre code { display: block; padding: 12px 14px; background: #0a0a0a !important; border-radius: 8px; font-size: 0.85em; line-height: 1.5; }
  .bubble table { border-collapse: collapse; margin: 0 0 10px; font-size: 0.9em; display: block; overflow-x: auto; max-width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .bubble th { background: var(--surface-2); font-weight: 600; }
  .msg-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  #composer { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; }
  #composer input { flex: 1; padding: 10px 12px; font-size: 14px; }
  #composer button { padding: 10px 18px; font-size: 14px; }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="card auth-box">
    <h1 id="auth-title">Log in</h1>
    <p class="sub">LLM Router &mdash; cost-saving chat</p>
    <div class="auth-error" id="auth-error"></div>
    <input type="text" id="auth-username" placeholder="Username" autocomplete="username">
    <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
    <button id="auth-submit">Log in</button>
    <div class="auth-toggle">
      <span id="auth-toggle-text">No account? <a id="auth-toggle-link">Sign up</a></span>
    </div>
  </div>
</div>

<div class="app-shell" id="app-screen" hidden>
  <nav class="app-nav">
    <div id="app-nav-top-mount"></div>
    <button id="new-chat-btn" class="ghost">+ New chat</button>
    <div id="chat-list"></div>
    <div class="app-nav-spacer" style="flex:0;"></div>
    <div id="app-nav-bottom-mount"></div>
  </nav>
  <main class="app-main" id="chat-main">
    <div id="chat-header">
      <h2 id="chat-title">Select or start a chat</h2>
      <div id="cost-saved-stat"></div>
    </div>
    <div id="messages"><div class="empty-state">Start a new chat to see the router in action.</div></div>
    <div id="composer">
      <input type="text" id="composer-input" placeholder="Ask anything..." autocomplete="off" disabled>
      <button id="composer-send" disabled>Send</button>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="/static/nav.js"></script>
<script>
  marked.setOptions({ breaks: true });

  function renderMarkdown(text) {
    return DOMPurify.sanitize(marked.parse(text));
  }

  // Applied to the DOM after insertion rather than via marked's `highlight`
  // option, whose API has changed across marked versions -- this works
  // against the plain <pre><code> marked always outputs, regardless.
  function highlightCodeBlocks(container) {
    container.querySelectorAll("pre code").forEach(block => {
      try { hljs.highlightElement(block); } catch { /* unsupported language, leave as-is */ }
    });
  }

  let currentChatId = null;
  let isSignup = false;

  const authScreen = document.getElementById("auth-screen");
  const appScreen = document.getElementById("app-screen");
  const authError = document.getElementById("auth-error");

  async function api(path, opts = {}) {
    const resp = await fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
      credentials: "same-origin",
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.detail || `request failed (${resp.status})`);
    return data;
  }

  // --- auth ---
  function toggleAuthMode() {
    isSignup = !isSignup;
    document.getElementById("auth-title").textContent = isSignup ? "Sign up" : "Log in";
    document.getElementById("auth-submit").textContent = isSignup ? "Sign up" : "Log in";
    document.getElementById("auth-toggle-text").innerHTML = isSignup
      ? 'Have an account? <a id="auth-toggle-link">Log in</a>'
      : 'No account? <a id="auth-toggle-link">Sign up</a>';
    document.getElementById("auth-toggle-link").onclick = toggleAuthMode;
    authError.textContent = "";
  }
  document.getElementById("auth-toggle-link").onclick = toggleAuthMode;

  document.getElementById("auth-submit").onclick = async () => {
    const username = document.getElementById("auth-username").value.trim();
    const password = document.getElementById("auth-password").value;
    authError.textContent = "";
    try {
      await api(isSignup ? "/auth/signup" : "/auth/login", {
        method: "POST", body: JSON.stringify({ username, password }),
      });
      await enterApp();
    } catch (err) {
      authError.textContent = err.message;
    }
  };

  async function checkSession() {
    try {
      await api("/auth/me");
      await enterApp();
    } catch {
      authScreen.hidden = false;
    }
  }

  async function enterApp() {
    authScreen.hidden = true;
    appScreen.hidden = false;
    await initNav("chat");

    const params = new URLSearchParams(window.location.search);
    const chatParam = params.get("chat");
    await refreshChatList();
    if (chatParam) await openChat(parseInt(chatParam, 10));
  }

  // --- chats ---
  document.getElementById("new-chat-btn").onclick = async () => {
    const { id } = await api("/api/chats", { method: "POST", body: JSON.stringify({}) });
    await refreshChatList();
    await openChat(id);
  };

  async function refreshChatList() {
    const chats = await api("/api/chats");
    const listEl = document.getElementById("chat-list");
    listEl.innerHTML = "";
    chats.forEach(c => {
      const el = document.createElement("div");
      el.className = "chat-item" + (c.id === currentChatId ? " active" : "");
      el.innerHTML = `<div class="title">${escapeHtml(c.title)}</div>` +
        (c.total_cost > 0 || c.total_baseline_cost > 0
          ? `<div class="saved">saved $${c.cost_saved.toFixed(5)}</div>` : "");
      el.onclick = () => openChat(c.id);
      listEl.appendChild(el);
    });
  }

  async function openChat(chatId) {
    currentChatId = chatId;
    history.replaceState(null, "", `/app?chat=${chatId}`);
    const chat = await api(`/api/chats/${chatId}`);
    document.getElementById("chat-title").textContent = chat.title;
    document.getElementById("composer-input").disabled = false;
    document.getElementById("composer-send").disabled = false;
    renderCostSaved(chat.cost_saved);
    renderMessages(chat.messages);
    await refreshChatList();
  }

  function renderCostSaved(saved) {
    document.getElementById("cost-saved-stat").innerHTML =
      `<span class="label">saved this chat:</span> $${saved.toFixed(5)}`;
  }

  function renderMessages(messages) {
    const el = document.getElementById("messages");
    if (messages.length === 0) {
      el.innerHTML = '<div class="empty-state">Send a message to see it routed live.</div>';
      return;
    }
    el.innerHTML = "";
    messages.forEach(m => el.appendChild(renderMessage(m)));
    el.scrollTop = el.scrollHeight;
  }

  function renderMessage(m) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${m.role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (m.role === "assistant") {
      bubble.innerHTML = renderMarkdown(m.content);
      highlightCodeBlocks(bubble);
    } else {
      bubble.textContent = m.content;
    }
    wrap.appendChild(bubble);

    if (m.role === "assistant" && m.tier) {
      const meta = document.createElement("div");
      meta.className = "msg-meta";
      let html = `<span class="badge ${m.tier}">${m.tier}</span>`;
      html += `<span class="mono">$${(m.cost ?? 0).toFixed(5)} &middot; ${(m.latency_ms ?? 0).toFixed(0)}ms</span>`;
      if (m.escalated) html += `<span class="badge escalated">escalated</span>`;
      meta.innerHTML = html;
      wrap.appendChild(meta);
    }
    return wrap;
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  // --- sending messages ---
  const input = document.getElementById("composer-input");
  const sendBtn = document.getElementById("composer-send");

  async function sendMessage() {
    const content = input.value.trim();
    if (!content || !currentChatId) return;
    input.value = "";
    sendBtn.disabled = true;
    input.disabled = true;

    const messagesEl = document.getElementById("messages");
    if (messagesEl.querySelector(".empty-state")) messagesEl.innerHTML = "";
    messagesEl.appendChild(renderMessage({ role: "user", content }));
    const loadingEl = document.createElement("div");
    loadingEl.className = "msg assistant";
    loadingEl.innerHTML = '<div class="bubble loading-text">Routing&hellip;</div>';
    messagesEl.appendChild(loadingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const data = await api(`/api/chats/${currentChatId}/messages`, {
        method: "POST", body: JSON.stringify({ content }),
      });
      loadingEl.replaceWith(renderMessage({
        role: "assistant", content: data.content, tier: data.tier,
        cost: data.cost, latency_ms: data.latency_ms, escalated: data.escalated,
      }));
      renderCostSaved(data.chat_cost_saved);
      await refreshChatList();
    } catch (err) {
      loadingEl.querySelector(".bubble").textContent = "Error: " + err.message;
      loadingEl.querySelector(".bubble").style.color = "var(--critical)";
    } finally {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  sendBtn.onclick = sendMessage;
  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

  checkSession();
</script>
</body>
</html>
