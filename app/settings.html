<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThriftLLM &mdash; Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;650&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>

  /* A table can't reflow, so on a phone it scrolls inside its own box
     instead of pushing the page sideways. */
  .table-wrap { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 760px) { .table-wrap table { min-width: 520px; } }
</style>
<script>document.documentElement.classList.add("js-motion");</script>
</head>
<body>
<div class="app-shell">
  <div class="ambient" aria-hidden="true">
    <div class="grid"></div>
    <div class="orb a"></div>
    <div class="orb b"></div>
  </div>

  <nav class="app-nav">
    <div id="app-nav-top-mount"></div>
    <div id="app-nav-links-mount"></div>
    <div class="app-nav-spacer"></div>
    <div id="app-nav-bottom-mount"></div>
  </nav>
  <main class="app-main">
    <div class="app-content">

      <div class="page-header animate-in">
        <div>
          <h1>Settings</h1>
          <p class="sub">Account-level API keys for programmatic routing.</p>
        </div>
      </div>

      <section class="reveal" style="margin-bottom:0;">
        <p class="section-sub">For programmatic access to <code>/api/v1/route</code>. These identify
          your account &mdash; they are not your model provider keys, which live under
          <a href="/models">Models &amp; calibration</a>. Each key is its own session (see
          <a href="/sessions">Sessions</a>).</p>
        <div class="card reveal">
          <div id="new-key-banner"></div>
          <div class="table-wrap"><table id="keys-table"><thead><tr><th>Name</th><th>Key</th><th>Created</th><th>Last used</th><th></th></tr></thead><tbody></tbody></table></div>
          <div style="margin-top:12px; display:flex; gap:8px;">
            <input type="text" id="new-key-name" placeholder="key name (optional)">
            <button id="create-key-btn">+ New API key</button>
          </div>
        </div>
      </section>

    </div>
  </main>
</div>

<script src="/static/reveal.js"></script>
<script src="/static/nav.js"></script>
<script>
  async function api(path, opts = {}) {
    const resp = await fetch(path, {
      ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
      credentials: "same-origin",
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.detail || `request failed (${resp.status})`);
    return data;
  }
  function fmt(n) { return "$" + (n ?? 0).toFixed(5); }
  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  async function loadKeys() {
    const keys = await api("/api/keys");
    const tbody = document.querySelector("#keys-table tbody");
    tbody.innerHTML = keys.map(k => `
      <tr>
        <td>${esc(k.name)}</td>
        <td class="mono">${esc(k.key_prefix)}...</td>
        <td style="color:var(--text-muted)">${k.created_at.slice(0, 10)}</td>
        <td style="color:var(--text-muted)">${k.last_used_at ? k.last_used_at.slice(0, 10) : "never"}</td>
        <td>${k.revoked
          ? '<span class="badge revoked">revoked</span>'
          : `<button class="ghost" data-revoke="${k.id}">revoke</button>`}</td>
      </tr>
    `).join("") || '<tr><td colspan="5"><div class="empty-state">No keys yet.</div></td></tr>';

    tbody.querySelectorAll("[data-revoke]").forEach(btn => {
      btn.onclick = async () => {
        await api(`/api/keys/${btn.dataset.revoke}`, { method: "DELETE" });
        loadKeys();
      };
    });
  }

  document.getElementById("create-key-btn").onclick = async () => {
    const name = document.getElementById("new-key-name").value.trim() || null;
    const data = await api("/api/keys", { method: "POST", body: JSON.stringify({ name }) });
    const banner = document.getElementById("new-key-banner");
    banner.innerHTML = `<div class="success-box">Your new API key (shown once &mdash; copy it now):<span class="key mono">${esc(data.key)}</span></div>`;
    document.getElementById("new-key-name").value = "";
    loadKeys();
  };

  (async function init() {
    await initNav("settings");
    loadKeys();
  })();
</script>
</body>
</html>
