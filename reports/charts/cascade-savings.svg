<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img" aria-label="Cascade cost versus frontier-only">
<text x="0.0" y="22.0" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#9b9b9b" text-anchor="start" font-weight="600">What the cascade actually cost</text>
<text x="0.0" y="38.0" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#767676" text-anchor="start" font-weight="400">81 routed queries, measured - versus sending every one to frontier</text>
<rect x="150" y="56" width="428.6" height="34" rx="3" fill="#199e70"/>
<text x="138.0" y="77.0" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#9b9b9b" text-anchor="end" font-weight="600">frontier-only</text>
<text x="588.6" y="77.0" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#9b9b9b" text-anchor="start" font-weight="400">$0.10944</text>
<rect x="150" y="110" width="115.2" height="34" rx="3" fill="#3987e5"/>
<text x="138.0" y="131.0" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#9b9b9b" text-anchor="end" font-weight="600">cascade</text>
<text x="275.2" y="131.0" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#9b9b9b" text-anchor="start" font-weight="400">$0.02941</text>
<text x="150.0" y="182.0" font-family="IBM Plex Sans, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#3987e5" text-anchor="start" font-weight="700">73% cheaper</text>
<text x="150.0" y="202.0" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#767676" text-anchor="start" font-weight="400">routed - cheap: 42  mid: 36  frontier: 3   |   escalated: 13</text>
</svg>
